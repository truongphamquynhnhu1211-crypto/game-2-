<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trò chơi 2 người trực tuyến</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        #game-box { margin-top: 20px; padding: 20px; background: white; display: inline-block; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 4px; }
        button:hover { background: #ff6b81; }
    </style>
</head>
<body>

    <h1>Trò chơi Đua Tốc Độ 2 Người</h1>
    <h3 id="role-status">Đang kết nối vào phòng...</h3>
    <h2 id="notification">Chờ người chơi thứ 2...</h2>

    <div id="game-box">
        <p>Điểm của bạn: <span id="my-score">0</span></p>
        <p>Điểm đối thủ: <span id="opponent-score">0</span></p>
        <button id="click-btn" disabled>Bấm liên tục!</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
